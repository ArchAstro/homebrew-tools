name: Validate Tap

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate formula syntax
        run: |
          ruby -c Formula/archastro.rb
          ruby -c Formula/archagent.rb

      - name: Validate update scripts
        run: |
          bash -n scripts/update-archastro-formula.sh
          bash -n scripts/update-archagent-formula.sh

      - name: Reject pre-rename repository URLs
        run: |
          legacy_repo='ArchAstro/archastro''-cli'
          if grep -Rni --exclude-dir=.git "$legacy_repo" .; then
            echo "Use the canonical ArchAstro/archastro repository URL." >&2
            exit 1
          fi
